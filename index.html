<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>やどかり易占い</title>
    <style>
        body { text-align: center; font-family: 'Hiragino Mincho ProN', serif; background-color: #f4eee1; color: #333; padding: 50px; }
        .container { background: #fffaf0; padding: 30px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); display: inline-block; max-width: 400px; border: 2px solid #D2B48C; transition: all 0.5s; }
        
        /* イラスト画像のスタイル */
        .home-image { 
            max-width: 100%; 
            height: auto; 
            border-radius: 15px; 
            margin-bottom: 20px; 
            border: 1px solid #ccc; 
            display: block; 
            margin-left: auto; 
            margin-right: auto;
        }

        #gua-area { font-size: 60px; font-weight: bold; margin: 20px 0; color: #333; line-height: 1; }

        .start-button { background: #CD853F; color: white; border: none; padding: 12px 30px; border-radius: 25px; cursor: pointer; font-size: 18px; margin-top: 20px; transition: background 0.3s; box-shadow: 0 4px 0 #A0522D; }
        .start-button:hover { background: #A0522D; }
        .start-button:active { position: relative; top: 3px; box-shadow: 0 1px 0 #A0522D; }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <!-- 直接URLを指定したイラスト画像 -->
        <img src="https://github.com/user-attachments/assets/92d393ad-930b-469b-b192-afaa58df726a" alt="やどかり易占いのホームイラスト" class="home-image" id="main-image">
        
        <h1 id="title">やどかり易占い</h1>
        
        <!-- ここに卦（線）が表示される -->
        <div id="gua-area"></div>

        <p id="message">
            「表か裏か」…シンプルな二択の先に、<br>
            今のあなたへのメッセージが待っています。<br>
            海からの不思議な託宣を聞いてみませんか？
        </p>
        
        <button class="start-button" id="main-button" onclick="uranai()">占いを始める</button>
    </div>

    <script>
        function uranai() {
            const guaList = [
                { symbol: "☰", name: "乾（けん）", msg: "天の恵みあり。迷わず突き進め！絶好調なり。" },
                { symbol: "☷", name: "坤（こん）", msg: "大地の如く広き心で。受け入れることで道が開ける。" },
                { symbol: "☵", name: "坎（かん）", msg: "水の流れは険し。今は慎重に、力を蓄える時。" },
                { symbol: "☲", name: "離（り）", msg: "火の如く情熱的に。美しさが際立つが、熱しすぎに注意。" },
                { symbol: "☶", name: "艮（ごん）", msg: "山の如く動じず。今は止まり、静かに時を待つべし。" },
                { symbol: "☱", name: "兌（だ）", msg: "沢の如く悦びあり。笑顔とお喋りで皆を幸せに。" },
                { symbol: "☴", name: "巽（そん）", msg: "風の如くしなやかに。流れに乗れば、遠くまで行ける。" },
                { symbol: "☳", name: "震（しん）", msg: "雷の如き衝撃。変化を恐れず、大胆に行動せよ。" }
            ];
            
            const randomIndex = Math.floor(Math.random() * guaList.length);
            const resultGua = guaList[randomIndex];

            document.getElementById("main-image").style.display = "none";
            document.getElementById("title").innerText = "託宣";
            document.getElementById("gua-area").innerText = resultGua.symbol;
            document.getElementById("message").innerHTML = `今日のあなたの卦は<br><strong>【${resultGua.name}】</strong><br><br>${resultGua.msg}`;
            
            const button = document.getElementById("main-button");
            button.innerText = "もう一度占う";
            button.onclick = function() { location.reload(); };
            document.getElementById("main-container").style.backgroundColor = "#fff";
        }
    </script>

</body>
</html>
